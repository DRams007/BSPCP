# BSPCP Production NGINX Configuration
# Full server block for /etc/nginx/sites-available/bspcp

server {
    listen 80;
    server_name bspcp.org.bw www.bspcp.org.bw;
    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name bspcp.org.bw www.bspcp.org.bw;

    # SSL certificates (update paths as needed)
    # ssl_certificate     /etc/letsencrypt/live/bspcp.org.bw/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/bspcp.org.bw/privkey.pem;

    root /var/www/bspcp/dist;
    index index.html;

    # CRITICAL: Forward protocol and host to Express so req.protocol = 'https'
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;

    # Serve the React frontend (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the Node.js backend
    location /api/ {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header Host              $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy /uploads requests to the Node.js backend (user-uploaded files)
    location /uploads/ {
        proxy_pass http://localhost:3001/uploads/;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host              $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
    }
}
